plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'com.google.firebase.crashlytics'
    id 'com.google.gms.google-services'
}

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.pays.pos"
        minSdkVersion 23
        targetSdkVersion 30
        versionCode 8
        versionName "1.7"


        sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs/'] } }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi' , 'x86',  'x86_64',"armeabi-v7a", 'arm64-v8a'
        }

    }


    signingConfigs {
        release {
            storeFile file('/home/ab/Documents/snackhq.jks') // Path to your keystore file
            storePassword 'snackhq'
            keyAlias 'snackhq'
            keyPassword 'snackhq'
        }
    }

    buildTypes {
        release {
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    hilt {
        enableTransformForLocalTests = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {

        main {
            jniLibs.srcDirs = ['src/main/jniLibs/']
            aidl.srcDirs = ['src/main/java']

        }

    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {

        dataBinding = true
        // for view binding:
        viewBinding = true
        aidl true
    }
    namespace 'com.pays.pos'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {

    implementation fileTree(include: ['*.jar','*.aar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.7.0'

    // Printer SDK
    implementation files('libs/ePOS2.jar')
    // Design (UI)
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    //sdp and ssp
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.firebase:firebase-messaging-ktx:23.0.0'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.2.9'


    //Navigation
    def nav_version = "2.3.5"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.0'

    //Kotlin Coroutines
    def coroutines_android_version = '1.5.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_android_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_android_version"

    //Room Database
    def room_version = "2.3.0"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    kapt "org.xerial:sqlite-jdbc:3.41.2.2"



    //Livedata and Viewmodel
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-common:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.0'

    //Activity/Fragment ktx
    implementation 'androidx.activity:activity-ktx:1.4.0'
    implementation "androidx.fragment:fragment-ktx:1.3.6"

    //Dagger Hilt
    implementation 'com.google.dagger:hilt-android:2.37'
    kapt 'com.google.dagger:hilt-compiler:2.37'

    //ViewPager2
    implementation "androidx.viewpager2:viewpager2:1.0.0"

    //paging
    implementation 'androidx.paging:paging-runtime:3.1.1'
   // implementation "androidx.room:room-paging:$room_version"

    //passcode
    implementation project(path: ':passcodeview')



    //Masking
    implementation 'com.github.santalu:mask-edittext:1.1.1'

    //Google Places SDK
    implementation 'com.google.android.libraries.places:places:2.5.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.github.mukeshsolanki:Google-Places-AutoComplete-EditText:0.0.8'

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // XML parser
    implementation ('com.squareup.retrofit2:converter-simplexml:2.3.0') {
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'stax', module: 'stax'
    }


    implementation "com.github.skydoves:powermenu:2.0.6"

    implementation("com.google.guava:guava:30.1.1-android")

    //Generate QR Code
    implementation 'com.github.kenglxn.QRGen:android:2.6.0'

    //scanner
    implementation project(':BarcodeScannerLibrary')

    //Action Cable
    implementation 'com.github.hosopy:actioncable-client-java:0.1.2'

    implementation 'no.nordicsemi.android.support.v18:scanner:1.6.0'

    //firebase crashanalytics
    implementation 'com.google.firebase:firebase-crashlytics:18.2.7'
    implementation 'com.google.firebase:firebase-crash:16.2.1'


    implementation platform('com.google.firebase:firebase-bom:29.0.4')
    implementation 'com.google.firebase:firebase-analytics-ktx'

    //direct boot set
    implementation 'com.google.firebase:firebase-messaging-directboot:23.0.5'


    implementation 'com.testfairy:testfairy-android-sdk:1.+@aar'

    implementation 'com.github.stealthcopter:AndroidNetworkTools:0.4.5.3'


    //Phone no Fromating
    implementation 'com.googlecode.libphonenumber:libphonenumber:7.2.2'
    implementation 'com.github.poovamraj:PinEditTextField:1.2.6'
    implementation files('libs/mtusdk.aar')

    //WorkManager for background task
    implementation 'androidx.work:work-runtime:2.7.1'
    implementation "androidx.work:work-runtime-ktx:2.7.1"
    implementation 'com.sunmi:external-printerlibrary:1.0.10'
    implementation 'com.sunmi:printerlibrary:1.0.18'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.github.gcacace:signature-pad:1.3.1'

    implementation ('com.starmicronics:stario10:1.4.0') {
        exclude group: "com.android.support", module: "support-v4"
    }


    implementation 'com.android.volley:volley:1.2.1'


}